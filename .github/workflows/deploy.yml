name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build
        env:
          # Optional override for the football-predictor API URL. Left unset,
          # the /predictor page auto-targets https://predictor-api.hulsambath.me
          # when served from hulsambath.me, so these aren't required. Set them
          # as Actions "Repository variables" only to point at a different API.
          NEXT_PUBLIC_PREDICTOR_API: ${{ vars.NEXT_PUBLIC_PREDICTOR_API }}
          NEXT_PUBLIC_PREDICTOR_WS:  ${{ vars.NEXT_PUBLIC_PREDICTOR_WS }}
        run: npm run build

      - name: Ensure trip images are in out
        run: |
          if [ -d "public/trip-images" ]; then
            rm -rf out/trip-images
            mkdir -p out/trip-images
            cp -R public/trip-images/. out/trip-images/
          else
            echo "public/trip-images not found; skipping copy"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
